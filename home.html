<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title & favicon -->
    <title>Github Issue Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon" />
    <!-- daisyUI & TailwindCSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- google font cdn -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- style file -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="font-geist">
      <!-- navbar  -->
      <nav class="navbar bg-base-100 shadow-sm">
        <div class="navbar mx-auto max-w-7xl flex justify-between">
          <div class="flex-1 flex items-center">
            <img src="./assets/github-logo.png" alt="github-logo" class="w-9 h-9" />
            <h1 class="text-xl font-medium text-black ml-2">Github Issue Tracker</h1>
          </div>

          <div class="flex gap-2 flex-1 justify-end">
            <input type="text" placeholder="Search" class="input font-medium w-60" />

            <button class="px-2 py-2 bg-indigo-600 text-white font-medium rounded">
              <span><i class="fa-solid fa-plus"></i></span> New Issue
            </button>
          </div>
        </div>
      </nav>

      <!-- buttons -->
      <section id="buttons" class="w-7xl py-5 px-4 bg-white rounded-md mx-auto mt-6 border border-gray-300 space-x-2">
        <button
          class="px-6 py-1.5 rounded-md cursor-pointer capitalize border border-gray-400 text-black font-medium hover:bg-gray-100"
        >
          all
        </button>

        <button
          class="px-6 py-1.5 rounded-md cursor-pointer capitalize border border-gray-400 text-black font-medium hover:bg-gray-100"
        >
          open
        </button>

        <button
          class="px-6 py-1.5 rounded-md cursor-pointer capitalize border border-gray-400 text-black font-medium hover:bg-gray-100"
        >
          closed
        </button>
      </section>

      <!-- issues -->
      <section class="max-w-7xl mx-auto shadow-md rounded-md">
        <!-- total counter header -->
        <div
          class="w-full mt-6 border-gray-300 px-4 py-5 border-l border-r border-t border-b-2 rounded-tl-md rounded-tr-md"
        >
          <div class="w-full flex justify-between">
            <!-- left -->
            <div class="h-10 flex gap-3 items-center">
              <!-- image -->
              <div class="h-12 w-12 p-1.5 bg-indigo-200 rounded-full flex justify-center items-center">
                <img src="./assets/Aperture.png" alt="aperture" class="w-full h-full" />
              </div>

              <!-- text -->
              <div class="">
                <h1 class="font-medium text-xl capitalize"><span>0</span> issues</h1>
                <p class="text-base text-gray-700">Track and manage your project issues</p>
              </div>
            </div>
            <!-- right -->
            <div class="flex items-center gap-5">
              <!-- open -->
              <div class="flex items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <p class="text-base capitalize font-medium">open</p>
              </div>
              <!-- closed -->
              <div class="flex items-center gap-1">
                <div class="w-3 h-3 rounded-full bg-indigo-600"></div>
                <p class="text-base capitalize font-medium">closed</p>
              </div>
            </div>
          </div>
        </div>

        <!-- all issues card container -->
        <div class="py-4 grid grid-cols-3 gap-4 px-4 bg-gray-50 rounded-bl-md rounded-br-md">
          <!-- card -->
          <div class="card border-t-3 border-green-500 rounded-md shadow-md">
            <!-- upper -->
            <div class="space-y-6 p-4">
              <!-- priority -->
              <div class="flex items-center justify-between">
                <!-- left -->
                <div class="w-7 h-7 rounded-full bg-green-200 flex justify-center items-center">
                  <div class="w-5 h-5 rounded-full border-green-600 border-2 border-dashed"></div>
                </div>
                <!-- right -->
                <div class="px-4 py-0.5 rounded-full bg-red-200">
                  <p class="capitalize">high</p>
                </div>
              </div>
              <!-- title & subtitle -->
              <div class="space-y-2">
                <h2 class="text-2xl">Lorem ipsum dolor sit amet.</h2>
                <p class="text-gray-500 leading-none">
                  Lorem ipsum dolor, sit amet consectetur adipisicing elit. Harum, dolore.
                </p>
              </div>
              <!-- bugs -->
              <div class="flex gap-2">
                <div class="px-4 py-0.5 rounded-full bg-red-200">
                  <p class="capitalize">high</p>
                </div>
                <div class="px-4 py-0.5 rounded-full bg-red-200">
                  <p class="capitalize">high</p>
                </div>
              </div>
            </div>
            <!-- lower -->
            <div class="py-10 border-t-2 px-4 border-gray-200 mt-5">
              <p>#1 by john_doe</p>
              <p>1/15/2024</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
