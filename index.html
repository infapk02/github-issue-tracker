<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title & favicon -->
    <title>Github Issue Tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon" />
    <!-- daisyUI & TailwindCSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- google font cdn -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- style file -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- login form -->
    <section class="w-full h-screen bg-white font-geist flex items-center justify-center">
      <div class="w-md h-[90%] bg-gray-100 rounded-md p-10 flex flex-col items-center shadow-md">
        <!-- image and title -->
        <div class="flex flex-col items-center">
          <img src="./assets/github-logo.png" alt="github-logo" />
          <h1 class="text-3xl capitalize font-medium text-black mt-2">github issue tracker</h1>
          <p class="capitalize text-base text-black mt-2">Sign in to manage your issues</p>
        </div>

        <form class="w-full mt-10 flex flex-col gap-4">
          <div class="w-full">
            <label for="username" class="capitalize text-base font-medium text-black">username</label>
            <input
              type="text"
              id="username"
              placeholder="Enter Username"
              class="input input-bordered w-full mt-1 outline-none"
            />
          </div>

          <div class="w-full">
            <label for="password" class="capitalize text-base font-medium text-black">password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter Password"
              class="input input-bordered w-full mt-1 outline-none"
            />
          </div>

          <button type="submit" id="signInBtn" class="btn btn-primary w-full mt-3 capitalize">sign in</button>

          <p class="text-center font-medium mt-4 text-black">Demo Credentials:</p>

          <div class="w-full h-fit p-4 bg-gray-300 rounded-md">
            <p class="text-base font-medium text-black">Username: <span class="font-normal">Admin</span></p>
            <p class="text-base font-medium text-black">Password: <span class="font-normal">admin123</span></p>
          </div>
        </form>
      </div>
    </section>

    <!-- script file -->
    <script src="./script/script.js"></script>
  </body>
</html>
